/* */
:root{
  --bg:var(--color-bg-page); --paper:var(--color-bg-subtle); --paper-2:var(--color-bg-sunken);
  --ink:var(--color-text-heading); --ink-2:var(--color-text-body); --ink-3:var(--color-text-muted); --ink-on-tint:var(--color-text-on-tint);

  --accent:var(--color-brand-primary); --accent-2:var(--color-brand-primary-hover); --accent-3:var(--color-brand-primary-active); --accent-weak:var(--color-brand-primary-weak); --on-accent:var(--color-brand-on-primary);
  --brand-orange:var(--color-brand-accent); --focus:var(--color-focus-ring); --focus-dark:var(--color-focus-ring-on-dark); --inv-text:var(--color-text-inverse-muted); --inv-link:var(--p-color-blue-200);
  --ok:var(--color-status-success-fg); --ok-weak:var(--color-status-success-bg); --warn:var(--color-status-warning-fg); --warn-weak:var(--color-status-warning-bg);
  --bad:var(--color-status-error-fg); --bad-weak:var(--color-status-error-bg); --bad-solid:var(--color-status-error-solid); --info:var(--color-status-info-fg); --info-weak:var(--color-status-info-bg);
  --c-perf:var(--color-category-perf-bar); --c-exhi:var(--color-category-exhi-bar); --c-edu:var(--color-category-edu-bar); --c-etc:var(--color-category-etc-bar); --c-org:var(--color-category-org-bar);
  --c-perf-w:var(--color-category-perf-bg); --c-exhi-w:var(--color-category-exhi-bg); --c-edu-w:var(--color-category-edu-bg); --c-etc-w:var(--color-category-etc-bg); --c-org-w:var(--color-category-org-bg);
  --btn-h:var(--control-h); --r:var(--p-radius-md); --r-lg:var(--p-radius-lg); --shadow:var(--elevation-dropdown); --ease-out:var(--p-easing-out);
}

.inp{width:100%;height:var(--btn-h);border:1.5px solid var(--field);border-radius:var(--r);padding:0 16px;font:inherit;font-size:.889rem;background:var(--bg);color:var(--ink)}

.ph.t1{background:linear-gradient(140deg,var(--color-brand-primary-weak),var(--p-color-blue-200))} .ph.t2{background:linear-gradient(140deg,#FDF0EC,#F7C8B8)} .ph.t3{background:linear-gradient(140deg,var(--color-status-success-bg),#B8E5CA)} .ph.t4{background:linear-gradient(140deg,#F6FAEF,#D2E8B0)} .ph.t5{background:linear-gradient(140deg,var(--color-status-warning-bg),#FBDDA0)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 24px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.card{position:relative;display:block}
.card .ph{aspect-ratio:4/5}
.card.wide .ph{aspect-ratio:4/3}
.card .ov{position:absolute;inset:0;border-radius:var(--r);background:rgba(11,42,65,.86);color:var(--color-text-inverse);padding:20px;display:flex;align-items:flex-end;font-size:.889rem;opacity:0;transition:var(--motion-fade)}
.card:hover .ov,.card:focus-visible .ov{opacity:1}
.card .heart{position:absolute;top:10px;right:10px;z-index:var(--p-z-raised);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--elevation-raised)}
.card .heart.on{color:var(--accent)} .card .heart.on .ic{fill:currentColor}
html[data-hc="1"] .card .heart{background:var(--color-bg-page);border:1px solid var(--color-text-heading)}
.card .meta{padding-top:12px}
.card .nm{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px}
.card .fd{font-size:.778rem;color:var(--ink-2);margin-top:2px}
.card .ln{font-size:.778rem;color:var(--ink-3);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{margin-top:8px}
.card.priv .ph{filter:grayscale(1);opacity:.6}
.kind{position:absolute;left:10px;top:10px;z-index:var(--p-z-raised)}
.box{border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;background:var(--bg)}
.box-p{background:var(--paper);border-radius:var(--r-lg);padding:24px}
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--info-weak);color:var(--ink);border-radius:var(--r);padding:16px 20px;font-size:.889rem}
.callout .ic{color:var(--info);margin-top:4px}
.callout.warn,.callout.bad{background:var(--bad-weak);border:1px solid color-mix(in srgb,var(--bad-solid) 30%,transparent);border-radius:var(--r);font-weight:500}
.callout.warn .ic,.callout.bad .ic{color:var(--bad-solid);width:1.3em;height:1.3em;margin-top:1px}
.callout.warn b,.callout.bad b{color:var(--bad)}
html[data-hc="1"] .callout.warn,html[data-hc="1"] .callout.bad{border-left-color:var(--color-status-error-fg)}
/* 제작참고 메모 — 실제 화면 아님(프로토타입 전용) */
.ref{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:8px 12px;border:1.5px dashed #8B5CF6;border-radius:var(--r);background:#F5F3FF;color:#4C1D95;font-size:.778rem;line-height:var(--p-font-leading-normal);text-align:left;font-weight:500}
.ref-tag{flex:none;background:#7C3AED;color:var(--color-text-inverse);font-weight:700;border-radius:var(--p-radius-sm);padding:1px 8px;font-size:.667rem;letter-spacing:var(--p-font-tracking-wide)}
.ref .link{color:#5B21B6}
html.noref .ref{display:none!important}
.fb-step{display:inline-flex;align-items:baseline;gap:2px;margin-right:12px;font-weight:900;font-size:1.111rem;color:var(--accent-2);font-variant-numeric:tabular-nums}
.fb-step small{font-size:.778rem;font-weight:500;color:var(--ink-3)}
.savebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;border-radius:var(--r);background:var(--paper);font-size:.778rem;transition:var(--motion-color)}
.savebar .sb-msg{flex:1;color:var(--ink-2)}
.savebar.dirty{background:var(--warn-weak);box-shadow:inset 0 0 0 2px var(--warn)}
.savebar.dirty .sb-msg{color:var(--warn);font-weight:700}
/* 영역 이탈 방지 — 그리드 자식이 내용 길이만큼 늘어나지 않도록 */
.grid2>*,.grid3>*,.grid4>*,.pf-top>*,.cal-wrap>*,.mapw>*,.my>*,.kpi>*,.stat4>*{min-width:0}
.side nav a{min-width:0;white-space:normal;line-height:var(--p-font-leading-snug)}
.side nav a>span{flex:none}
.card .nm,.card .fd{overflow-wrap:anywhere}
.tbl td{overflow-wrap:anywhere}
.gal.gal{grid-template-columns:minmax(0,1fr)} .gal .th>*{min-width:0} .gal .th{grid-template-columns:repeat(6,minmax(0,1fr))}
.adm .grid2>.panel:last-child .f{grid-template-columns:1fr;gap:8px}
.adm .grid2>.panel:last-child .f-l{padding-top:0}
.adm .f-c .row{flex-wrap:wrap} .adm .f-c .row>.inp{flex:1;min-width:140px}
.f-c .row>.inp{min-width:0;flex:1 1 140px} .f-c .row{flex-wrap:wrap}
.tpl-prev{overflow:hidden;border-radius:var(--r)}
.btn.is-off{opacity:.45;cursor:not-allowed}
.qcard{border:2px solid var(--navy-2)!important}
.qcard.need{border-color:var(--bad-solid)!important;box-shadow:0 0 0 4px var(--bad-weak)}
.inq{border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg)} .inq+.inq{margin-top:12px}
.inq summary{display:flex;gap:12px;align-items:center;padding:16px 20px;cursor:pointer;list-style:none;font-size:.889rem}
.inq summary::-webkit-details-marker{display:none}
.inq summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-left:4px}
.inq[open] summary::after{transform:rotate(-135deg)}
.inq[open] summary{border-bottom:1px solid var(--line)}
.inq-b{padding:20px 20px}
.inq-a{margin-top:16px;padding:16px 20px;border-radius:var(--r);background:var(--accent-weak);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink)}
html[data-hc="1"] .callout{border:1px solid var(--color-text-heading)}

/* 검색 바 & 필터 */
.sbar{display:flex;gap:12px}
.sbar .inpw{position:relative;flex:1}
.sbar .inpw .ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:22px;height:22px}
.sbar .inp{padding-left:48px;height:58px;font-size:1rem;border-radius:var(--r)}
.sbar .btn{height:58px;border-radius:var(--r)}
.filters{border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 24px;margin-top:16px;background:var(--bg)}
.frow{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:16px 0;border-bottom:1px dashed var(--line);align-items:center}
.frow:last-of-type{border-bottom:0}
.frow>b{font-size:.889rem}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 0 8px;font-size:.778rem}
.selbar .chip{height:30px;font-size:.778rem;background:var(--paper);border-color:transparent}
.listhd{display:flex;justify-content:space-between;align-items:center;margin:32px 0 20px;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--field);border-radius:var(--r);overflow:hidden}
.seg button{height:40px;padding:0 16px;font-size:.778rem;font-weight:500}
.seg button+button{border-left:1.5px solid var(--field)}
.seg button.on{background:var(--accent);color:var(--color-text-inverse);font-weight:700}
.pager{display:flex;justify-content:center;gap:8px;margin-top:48px}
.pager a{min-width:42px;height:42px;display:grid;place-items:center;border-radius:var(--r);font-size:.889rem}
.pager a.on{background:var(--accent);color:var(--color-text-inverse);font-weight:700}
.pager a:hover:not(.on){background:var(--paper)}

/* ===== 표 ===== */
.tbl{width:100%;border-collapse:collapse;font-size:.778rem}
.tbl th{background:var(--paper);font-weight:700;color:var(--ink);text-align:left;padding:12px 16px;border-top:2px solid var(--navy-2);border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:var(--paper)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .c{text-align:center}
.tbl tr.pin td{background:var(--accent-weak)}
html[data-hc="1"] .tbl tr.pin td{background:var(--color-bg-sunken)}
.tblw{overflow-x:auto}

/* ===== 스텝 & 폼바 ===== */
.stepper{list-style:none;display:flex;margin:8px 0 32px;padding:0;counter-reset:s}
.stepper li{counter-increment:s;flex:1;min-width:0;position:relative;min-height:56px;padding-top:32px;text-align:center;font-size:0;color:var(--ink-3)}
.stepper li::before{content:'';position:absolute;top:11px;left:0;right:0;height:3px;background:var(--line)}
.stepper li:first-child::before{left:50%} .stepper li:last-child::before{right:50%}
.stepper li::after{content:counter(s);position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);display:grid;place-items:center;font-size:.667rem;font-weight:700;color:var(--ink-3)}
.stepper li.done::before,.stepper li.cur::before{background:var(--navy-2)} .stepper li.cur::before{background:linear-gradient(90deg,var(--navy-2) 50%,var(--line) 50%)}
.stepper li.done::after{background:var(--navy-2);border-color:var(--navy-2);color:var(--color-text-inverse)}
.stepper li.cur::after{background:var(--accent);border-color:var(--accent);color:var(--color-text-inverse);box-shadow:0 0 0 4px var(--accent-weak)}
.stepper li.cur{font-size:.778rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:visible}
html[data-hc="1"] .stepper li.done::before,html[data-hc="1"] .stepper li.done::after{background:var(--color-text-heading);color:var(--color-bg-page)}
.progress{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.progress b{font-size:.889rem;color:var(--accent-2)}
.formbar{position:sticky;bottom:0;z-index:var(--p-z-sticky);background:var(--bg);border-top:1px solid var(--line);margin-top:40px;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.formbar .l,.formbar .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.autosave{display:inline-flex;align-items:center;gap:8px;font-size:.778rem;color:var(--ink-3);margin-left:8px}
.formcard{border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 32px;background:var(--bg)}
.formcard+.formcard{margin-top:24px}
.formcard>h3{font-size:1rem;font-weight:700;padding:24px 0 8px;border-bottom:1px solid var(--line)}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:.667rem;color:var(--ink-3);margin-left:8px;font-weight:500}
.upl{border:2px dashed var(--field);border-radius:var(--r);padding:24px;text-align:center;color:var(--ink-3);font-size:.778rem;background:var(--paper)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.thumbs .ph{aspect-ratio:1}
.edtbl input{border:1px solid var(--line);border-radius:var(--p-radius-sm);height:38px;padding:0 12px;width:100%;font:inherit;font-size:.778rem;background:var(--bg);color:var(--ink)}

/* ===== 모달 ===== */
.dim{position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:var(--p-z-overlay);display:grid;place-items:center;padding:24px;overflow-y:auto;animation:fade .15s}
.modal{background:var(--bg);border-radius:var(--r-lg);width:min(560px,100%);box-shadow:var(--elevation-modal);position:relative;max-height:calc(100vh - 48px);overflow-y:auto;animation:pop .18s}
html[data-hc="1"] .modal{border:2px solid var(--color-text-heading)}
.modal.lg{width:min(760px,100%)} .modal.xl{width:min(1080px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:24px 24px 0}
.modal-h h2{font-size:1.333rem;font-weight:700}
.modal-b{padding:20px 24px 24px}
.modal-f{display:flex;gap:8px;padding:0 24px 24px}
.modal-f .btn{flex:1}
.mstep{display:flex;gap:8px;padding:16px 24px 0}
.mstep span{flex:1;height:4px;border-radius:var(--p-radius-sm);background:var(--line)} .mstep span.on{background:var(--accent)}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:translateY(12px);opacity:0}}
.typecard{border:2px solid var(--line);border-radius:var(--r-lg);padding:20px;text-align:left;display:flex;gap:16px;align-items:flex-start;width:100%}
.typecard:hover{border-color:var(--ink-3)}
.typecard.on{border-color:var(--accent);background:var(--accent-weak)}
.typecard .tc-i{width:44px;height:44px;border-radius:var(--r);background:var(--paper);display:grid;place-items:center;flex:none}
.typecard b{display:block;font-size:1rem} .typecard span{font-size:.778rem;color:var(--ink-2)}

/* ===== 홈 ===== */
.hero{background:var(--navy-2);color:var(--color-text-inverse);position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;padding:80px 40px 64px;position:relative;z-index:var(--p-z-raised)}
.hero .copy{font-family:var(--p-font-family-serif);font-size:1.111rem;line-height:var(--p-font-leading-relaxed);font-weight:400;opacity:.95}
.hero .copy p+p{margin-top:20px}
.hero .sbar{margin-top:40px}
.hero .sbar .inp{border:0}
.reco{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:.778rem;flex-wrap:wrap}
.reco a{padding:4px 16px;border-radius:999px;background:rgba(255,255,255,.12)}
.reco a:hover{background:rgba(255,255,255,.22)}
.hero-art{position:relative}
.hero-art svg{width:100%;height:auto}
.cta4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-1px;padding:0 40px 64px;position:relative;z-index:var(--p-z-raised)}
.cta{display:flex;flex-direction:column;justify-content:space-between;min-height:150px;border-radius:var(--r-lg);padding:24px 24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--color-text-inverse);transition:var(--motion-color),var(--motion-press)}
.cta:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.cta .n{font-size:.667rem;opacity:.6;letter-spacing:var(--p-font-tracking-widest)}
.cta b{font-size:1.111rem;display:flex;justify-content:space-between;align-items:center}
.cta.pri{background:var(--p-color-white);border-color:var(--color-text-inverse);color:var(--accent-3)}
.cta.pri:hover{background:var(--accent-weak)}
.hero svg.waves{color:var(--color-text-inverse);position:absolute;right:-40px;top:24px;width:720px;height:220px;opacity:.2;pointer-events:none}
.hero-full{min-height:calc(100vh - var(--hdr,122px));min-height:calc(100svh - var(--hdr,122px));display:flex;flex-direction:column;justify-content:center}
.hero-full .hero-in{grid-template-columns:1.35fr .65fr;align-items:center;gap:56px;padding:clamp(24px,6vh,64px) 40px clamp(56px,9vh,80px);width:100%}
.hero-full .copy{font-size:clamp(.889rem,2.4vh,1.111rem);line-height:var(--p-font-leading-relaxed)}
.hero-full .copy p+p{margin-top:clamp(8px,1.8vh,20px)}
.hero-full .sbar{margin-top:clamp(20px,4.5vh,48px)}
.cta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cta-grid .cta{min-height:clamp(96px,17vh,160px)}
.hero-deco{position:absolute;right:-40px;bottom:-20px;width:min(56vw,760px);opacity:.14;pointer-events:none}
.scroll-cue{position:absolute;left:50%;bottom:clamp(10px,2.4vh,22px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.667rem;color:var(--color-text-inverse);opacity:.75}
.scroll-cue:hover{opacity:1}
.scroll-cue .ic{transform:rotate(90deg);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{50%{translate:0 4px}}
@media (prefers-reduced-motion:reduce){.scroll-cue .ic{animation:none}}
@media (max-width:1100px){.hero-full .hero-in{grid-template-columns:1fr;gap:32px}}
.popups{position:fixed;inset:0;z-index:var(--p-z-popup);background:rgba(10,16,28,.45);display:grid;grid-template-columns:repeat(3,1fr);align-items:center;justify-items:center;padding:24px}
.popup{width:min(360px,100%);background:var(--bg);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--elevation-modal)}
.popup .ph{aspect-ratio:3/4;border-radius:0}
.popup .pf{display:flex;justify-content:space-between;font-size:.778rem;border-top:1px solid var(--line)}
.popup .pf button{padding:12px 16px}
.popup .pf button:hover{text-decoration:underline}

/* ===== 푸터 ===== */
.ft{background:var(--navy);color:var(--inv-text);font-size:.778rem;margin-top:0}
html[data-hc="1"] .ft{background:var(--color-bg-page);border-top:1px solid var(--color-text-heading);color:var(--color-text-heading)}
.ft-in{padding:48px 40px;display:grid;grid-template-columns:1fr auto;gap:32px}
.ft .logo{color:var(--color-text-inverse);font-size:1.111rem}
.ft .legal{margin-top:16px;line-height:var(--p-font-leading-relaxed)}
.ft .legal span+span::before{content:'|';margin:0 12px;opacity:.35}
.ft .cp{margin-top:16px;opacity:.6}
.ft-r{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.ft-r select{height:40px;background:transparent;color:var(--color-text-inverse);border:1px solid rgba(255,255,255,.3);border-radius:var(--r);padding:0 16px;font:inherit;font-size:.778rem;min-width:200px}
.sns{display:flex;gap:8px}
.sns a{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:.667rem;font-weight:700}
.ft-links{display:flex;gap:20px;font-weight:700;color:var(--color-text-inverse)}

/* ===== 상세 ===== */
.pf-top{display:grid;grid-template-columns:380px 1fr;gap:48px;padding-top:48px}
.pf-top .ph{aspect-ratio:4/5;border-radius:var(--r-lg)}
.pf-name{font-family:var(--type-display-family);font-size:2.222rem;font-weight:var(--type-display-weight);letter-spacing:var(--p-font-tracking-tight)}
.dl{display:grid;grid-template-columns:120px 1fr;gap:12px 16px;font-size:.889rem;margin-top:24px}
.dl dt{color:var(--ink-3)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:56px}
.tabs button{height:58px;padding:0 24px;font-weight:700;color:var(--ink-3);border-bottom:3px solid transparent;font-size:.889rem}
.tabs button.on{color:var(--accent-2);border-bottom-color:var(--accent)}
.hist{border-top:2px solid var(--navy-2)}
.hist li{display:grid;grid-template-columns:90px 1fr auto;gap:16px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:.889rem}
.hist li .y{color:var(--ink-3);font-variant-numeric:tabular-nums}
.pf-sec{margin-top:48px}
.pf-sec>h3{font-size:1rem;font-weight:700;margin-bottom:16px}
.prevnext{display:flex;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:64px}
.prevnext a{padding:20px 8px;font-size:.889rem;display:flex;gap:8px;align-items:center}
.gal{display:grid;grid-template-columns:1fr;gap:12px}
.gal .main{aspect-ratio:16/10;border-radius:var(--r-lg)}
.gal .th{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gal .th .ph{aspect-ratio:1;cursor:pointer}
.gal .th .ph.on{outline:3px solid var(--accent);outline-offset:-3px}
.vid{position:relative}
.vid .ph{aspect-ratio:16/9}
.vid .play{position:absolute;inset:0;display:grid;place-items:center}
.vid .play span{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:var(--color-text-inverse)}

/* 캘린더 (흰 배경·검정 글자 고정) */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;margin-top:24px}
.cal{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.cal-h h2{font-size:1.333rem;font-weight:700;font-variant-numeric:tabular-nums}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-g .dw{padding:12px;font-size:.778rem;font-weight:700;text-align:center;border-bottom:1px solid var(--line);background:var(--paper)}
.cal-g .dw.sun{color:var(--bad)} .cal-g .dw.sat{color:var(--info)}
.cal-g .d{min-height:124px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;font-size:.667rem;position:relative}
